name: Quantum Teleportation Validation Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  execute-matrix-verification:
    runs-on: ubuntu-latest

    steps:
    - name: Ingress Local Code Repository
      uses: actions/checkout@v4

    - name: Initialize Isolated Python Environment Node
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Execute Holographic State Twin and Run Probability Unit Tests
      run: |
        python quantum_simulation_twin.py
        python -m unittest test_quantum_core.py
        
